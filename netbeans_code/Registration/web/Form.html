<html>
    <head>
    </head>
<body>
    <h1>Welcome to the registration page</h1>
<form action="signup_1" method="POST">
  <label for="email">Email:</label>
  <input type="email" id="email" name="n1" required>
  <br><br>
  <label for="password">Password:</label>
  <input type="password" id="password" name="n2" required>
  <br><br>
  <label for="name">Name:</label>
  <input type="text" id="name" name="n3" required>
  <br><br>
  
  <label for="number">Contact:</label>
  <input type="number" id="number" name="n6">
  <br><br>

  <label for="address">Address:</label>
  <input type="text" id="address" name="n7" required>
  <br><br>

  <label for="security-question">Security Question:</label>
  <select id="security-question" name="n4" required>
    <option value="pet">What is the name of your first pet?</option>
    <option value="birth-city">In what city were you born?</option>
  </select>
  <br><br>

  <label for="answer">Answer:</label>
  <input type="text" id="answer" name="n5" required><br><br>

  <input type="submit" value="Submit">
</form>
</body>
</html>
